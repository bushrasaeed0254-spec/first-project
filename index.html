
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
} 

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 20% 20%, #35205e, transparent 40%),
        radial-gradient(circle at 80% 80%, #123d5a, transparent 40%),
        linear-gradient(135deg, #080816, #11152c, #090b19);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {
    text-align: center;
    padding: 30px;
    position: relative;
}

h1 {
    font-size: clamp(55px, 12vw, 150px);
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(
        90deg,
        #00f5ff,
        #a855f7,
        #ff4ecd,
        #00f5ff
    );
    background-size: 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradient 5s linear infinite;
    text-shadow: 0 0 40px rgba(168, 85, 247, 0.15);
}

p {
    color: #c4c4d8;
    font-size: 18px;
    letter-spacing: 5px;
    margin-top: 20px;
}

.line {
    width: 120px;
    height: 4px;
    margin: 25px auto;
    border-radius: 20px;
    background: linear-gradient(90deg, #00f5ff, #a855f7);
}

@keyframes gradient {
    0% { background-position: 0%; }
    100% { background-position: 300%; }
}

.glow {
    position: absolute;
    width: 300px;
    height: 300px;
    background: #873bff;
    filter: blur(150px);
    opacity: 0.15;
    border-radius: 50%;
    z-index: -1;
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="container">
    <h1>Bushra Saeed</h1>
    <div class="line"></div>
    <p>Web Developer</p>
</div>

<script>
document.addEventListener("mousemove", (e) => {
    const glow = document.querySelector(".glow");

    glow.style.left = e.clientX - 150 + "px";
    glow.style.top = e.clientY - 150 + "px";
});
</script>

</body>
</html>
